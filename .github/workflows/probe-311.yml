name: Probe 311 dataset

# Temporary reachability/schema probe. Manual dispatch only, commits nothing.
# Delete once the real 311 updater exists.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe data.boston.gov CKAN
        run: python scripts/probe_311.py
